db:
  image: postgres:17
  container_name: postgres19
  restart: always

  environment:
    POSTGRES_DB: postgres
    POSTGRES_USER: odoo19
    POSTGRES_PASSWORD: odoo19

  ports:
    - "5433:5432"

  volumes:
    - ./postgres:/var/lib/postgresql/data

  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U odoo19"]
    interval: 10s
    timeout: 5s
    retries: 5

odoo:
  build: .
  container_name: odoo19

  depends_on:
    db:
      condition: service_healthy

    ports:
      - "1069:8069"
      - "1072:8072"

    environment:
      HOST: db
      USER: odoo19
      PASSWORD: odoo19

    volumes:
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
      - ./logs:/var/log/odoo
      - odoo_data:/var/lib/odoo

volumes:
  odoo_data:
